<section class="cartao agenda">
  <header class="cartao-topo">
    <h2 class="cartao-titulo"><app-icone nome="calendario" /> Agenda do dia</h2>
  </header>

  <div class="agenda-tabela-rolagem">
    <table class="agenda-tabela">
      <thead><tr><th>Horário</th><th>Paciente</th><th>Telefone</th><th>Profissional</th><th>Status</th></tr></thead>
      <tbody>
        @for (item of itens(); track item.hora + item.paciente) {
          <tr>
            <td><span class="agenda-hora"><app-icone nome="relogio" /> {{ item.hora }}</span></td>
            <td><span class="agenda-paciente"><app-avatar [nome]="item.paciente" /> {{ item.paciente }}</span></td>
            <td>{{ item.telefone || '—' }}</td>
            <td>{{ item.profissional || '—' }}</td>
            <td>@if (item.status) { <app-chip-status [status]="item.status" /> } @else { — }</td>
          </tr>
        } @empty {
          <tr><td colspan="5" class="agenda-vazia">Nenhum atendimento agendado para hoje.</td></tr>
        }
      </tbody>
    </table>
  </div>
</section>
